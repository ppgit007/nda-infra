name: Terraform Validate

on:
  workflow_call:
    inputs:
      environment:
        description: 'Terraform environment folder'
        required: true
        type: string
        default: dev
      terraform_version:
        description: 'Terraform CLI version'
        required: false
        type: string
        default: '1.6.6'

permissions:
  contents: read

jobs:
  validate:
    name: Terraform fmt & validate (${{ inputs.environment }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      # Fails the stage if any *.tf file in the repo is not canonically formatted.
      - name: Terraform format check
        working-directory: .
        run: terraform fmt -check -recursive

      # Initialise providers only (no backend / no Azure auth needed for validation).
      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate
